name: V4.1 runtime smoke

on:
  push:
    branches: [fix/v41-colab-restart-drive-memory, main]
  pull_request:

jobs:
  v41-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install timm kagglehub optuna openpyxl scikit-learn matplotlib pandas pillow opencv-python-headless ipython
      - name: Compile raw and patched runners
        run: |
          python -m py_compile v4_parts/part_*.py runner_patch_v41.py
          python - <<'PY'
          from pathlib import Path
          raw = '\n'.join(Path(f'v4_parts/part_{i:02d}.py').read_text() for i in range(7))
          ns = {}
          src = Path('runner_patch_v41.py').read_text()
          exec(compile(src, 'runner_patch_v41.py', 'exec'), ns, ns)
          patched = ns['apply_v41'](raw)
          compile(patched, 'rimgraph_dg_v41_single_cell.py', 'exec')
          print('RIMGRAPH_V41_PATCH_COMPILE_PASSED')
          PY
      - name: Run V4 core end-to-end synthetic experiment
        env:
          MPLBACKEND: Agg
        run: python tests/synthetic_v4_smoke.py
