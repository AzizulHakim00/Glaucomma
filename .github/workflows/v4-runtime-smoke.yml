name: V4.3 runtime smoke

on:
  push:
    branches: [main, fix/v43-scientific-guards]
  pull_request:

jobs:
  v43-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install timm kagglehub optuna openpyxl scikit-learn matplotlib pandas pillow opencv-python-headless ipython
      - name: Compile patches
        run: python -m py_compile v4_parts/part_*.py runner_patch_v41.py runner_patch_v42.py runner_patch_v43.py runner_patch_v43_autograd.py
      - name: Test scientific guards
        run: python tests/test_v43_scientific_guards.py
      - name: Run complete full-stage synthetic experiment
        env:
          MPLBACKEND: Agg
        run: python tests/synthetic_v4_smoke.py
