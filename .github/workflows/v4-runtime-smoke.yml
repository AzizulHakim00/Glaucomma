name: V4 runtime smoke

on:
  push:
    branches: [feat/rimgraph-v4-scientific-rebuild, main]
  pull_request:

jobs:
  v4-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install timm kagglehub optuna openpyxl scikit-learn matplotlib pandas pillow opencv-python-headless ipython
      - name: Compile V4 runner
        run: python -m py_compile v4_parts/part_*.py
      - name: Run V4 end-to-end synthetic experiment
        env:
          MPLBACKEND: Agg
        run: python tests/synthetic_v4_smoke.py
