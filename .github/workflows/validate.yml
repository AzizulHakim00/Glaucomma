name: Validate V4.3 single-cell runner

on:
  push:
    branches: [main, fix/v43-scientific-guards]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and compile V4.3 runner
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = '\n'.join(Path(f'v4_parts/part_{i:02d}.py').read_text() for i in range(7))
          code = raw
          for patch_name, fn_name in [
              ('runner_patch_v41.py', 'apply_v41'),
              ('runner_patch_v42.py', 'apply_v42'),
              ('runner_patch_v43.py', 'apply_v43'),
          ]:
              ns = {}
              src = Path(patch_name).read_text()
              exec(compile(src, patch_name, 'exec'), ns, ns)
              code = ns[fn_name](code)
          compile(code, 'rimgraph_dg_v43_single_cell.py', 'exec')
          required = [
              'Prototype-aware balancing',
              'prototype_pair_count',
              'eligible_for_selection = va["stage"] == "full"',
              'vertical_cup_extent / vertical_disc_extent',
              'torch.fft.rfft(rim_vector',
              'cup_prob = raw[:, 1:2] * disc_prob',
              'gate_context',
              'RUN_COMPLETED.json',
          ]
          for marker in required:
              assert marker in code, marker
          print('RIMGRAPH_V43_PATCH_COMPILE_PASSED')
          PY
      - name: Validate clean immutable notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path('Glaucomma_RimGraphDG_Single_Cell.ipynb').read_text())
          assert nb['nbformat'] == 4
          assert len(nb['cells']) == 1
          assert nb['cells'][0]['cell_type'] == 'code'
          assert nb['cells'][0].get('outputs') == []
          source = ''.join(nb['cells'][0]['source'])
          assert "COMMIT = '5dd535544d5e5e3542a4c6f8ebccb4a47916acf0'" in source
          assert "runner_patch_v43.py" in source
          assert "'run_name': 'paper_run_v43'" in source
          assert "'code_revision': 'rimgraph-dg-v4.3-20260804'" in source
          assert "'batch_size': 2" in source and "'grad_accum': 2" in source
          assert 'FAILURE_TRACEBACK.txt' in source
          print('RIMGRAPH_V43_NOTEBOOK_VALIDATION_PASSED')
          PY
