name: Validate single-cell runner

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and syntax-check runner
        run: |
          cat runner_parts/part_*.py > /tmp/rimgraph_dg_single_cell.py
          python -m py_compile /tmp/rimgraph_dg_single_cell.py
          echo "8afb0f74d8d4af59137ca6a0bc35eab2c5addf61d2f93909354dfbb7763a5d7e  /tmp/rimgraph_dg_single_cell.py" | sha256sum --check
      - name: Validate notebook shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('Glaucomma_RimGraphDG_Single_Cell.ipynb')
          nb = json.loads(p.read_text())
          assert nb['nbformat'] == 4
          assert len(nb['cells']) == 1
          assert nb['cells'][0]['cell_type'] == 'code'
          print('Notebook is valid and contains exactly one code cell.')
          PY
