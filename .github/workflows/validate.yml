name: Validate V4 single-cell runner

on:
  push:
    branches: [main, feat/rimgraph-v4-scientific-rebuild]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and compile V4 runner
        run: |
          python - <<'PY'
          from pathlib import Path

          code = '\n'.join(Path(f'v4_parts/part_{i:02d}.py').read_text() for i in range(7))
          compile(code, 'rimgraph_dg_v4_single_cell.py', 'exec')
          required = [
              'class GlobalBaseline',
              'class FPNDecoder',
              'class BalancedSourceClassBatchSampler',
              'class RimGraphV4',
              'cross_source_duplicate_candidates.csv',
              'select_calibration',
              'bootstrap_ci',
              'scientific_diagnostic_report.md',
              'paper_run_v4',
          ]
          for marker in required:
              assert marker in code, f'Missing V4 marker: {marker}'
          print('V4 runner compiled and research safety markers were found.')
          PY

      - name: Validate one-cell notebook and immutable V4 pin
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb = json.loads(Path('Glaucomma_RimGraphDG_Single_Cell.ipynb').read_text())
          assert nb['nbformat'] == 4
          assert len(nb['cells']) == 1
          assert nb['cells'][0]['cell_type'] == 'code'
          source = ''.join(nb['cells'][0]['source'])
          assert "COMMIT = '6ed15baf1ca364efd8a589b7df5146efc63068bf'" in source
          assert "parts = [f'v4_parts/part_{i:02d}.py' for i in range(7)]" in source
          assert "code = '\\n'.join" in source
          assert "'run_name': 'paper_run_v4'" in source
          assert "'run_global_baseline': True" in source
          assert "'run_full_model': True" in source
          assert "'batch_size': 4" in source
          assert "'num_workers': 0" in source
          print('Notebook is one cell and pinned to immutable V4 research code.')
          PY
