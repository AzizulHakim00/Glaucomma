name: Validate single-cell runner

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and syntax-check runner
        run: |
          cat runner_parts/part_*.py > /tmp/rimgraph_dg_single_cell.py
          python -m py_compile /tmp/rimgraph_dg_single_cell.py
      - name: Validate safe unlabeled-image handling
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('runner_parts/part_02.py').read_text()
          required = [
              'excluded_unlabelled_images.csv',
              'missing_public_label_in_downloaded_package',
              'meta = meta.loc[~unresolved].copy()',
              'They are **not assigned guessed labels**',
          ]
          for marker in required:
              assert marker in code, f'Missing safety marker: {marker}'
          print('Unlabelled challenge images are excluded and audited safely.')
          PY
      - name: Validate notebook shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('Glaucomma_RimGraphDG_Single_Cell.ipynb')
          nb = json.loads(p.read_text())
          assert nb['nbformat'] == 4
          assert len(nb['cells']) == 1
          assert nb['cells'][0]['cell_type'] == 'code'
          source = ''.join(nb['cells'][0]['source'])
          assert "COMMIT = '8bd4273fd79b9457571a6811c0deb8ee383d24c6'" in source
          print('Notebook is valid, single-cell, and pinned to the fixed runner.')
          PY
