name: Validate single-cell runner

on:
  push:
    branches: [main, fix/colab-runner-v2]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct, patch, and syntax-check runner
        run: |
          python - <<'PY'
          from pathlib import Path

          original = '\n'.join(Path(f'runner_parts/part_{i:02d}.py').read_text() for i in range(8))
          patch_ns = {}
          patch_source = Path('runner_patch_v2.py').read_text()
          exec(compile(patch_source, 'runner_patch_v2.py', 'exec'), patch_ns, patch_ns)
          patched = patch_ns['apply_patches'](original)
          compile(patched, 'rimgraph_dg_single_cell_v2.py', 'exec')
          Path('/tmp/rimgraph_dg_single_cell_v2.py').write_text(patched)

          required = [
              'excluded_unlabelled_images.csv',
              'missing_public_label_in_downloaded_package',
              'weights_only=False',
              'GPU runtime is required',
              'completed_mode == bool(CFG["fast_dev_run"])',
              'improved = score > best_score',
          ]
          for marker in required:
              assert marker in patched, f'Missing patched safety marker: {marker}'
          print('Patched runner compiled and all safety markers were found.')
          PY

      - name: Validate notebook shape and immutable pin
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          nb = json.loads(Path('Glaucomma_RimGraphDG_Single_Cell.ipynb').read_text())
          assert nb['nbformat'] == 4
          assert len(nb['cells']) == 1
          assert nb['cells'][0]['cell_type'] == 'code'
          source = ''.join(nb['cells'][0]['source'])
          assert "COMMIT = 'b518431d60b60b2764886ad6d439284f54ebd57d'" in source
          assert "code = '\\n'.join" in source
          assert "patch_ns['apply_patches'](code)" in source
          assert "'run_name': 'paper_run_v2'" in source
          print('Notebook is valid, single-cell, resumable, and pinned to the immutable v2 runner.')
          PY
