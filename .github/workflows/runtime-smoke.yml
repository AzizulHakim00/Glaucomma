name: Runtime smoke test

on:
  push:
    branches: [fix/runtime-smoke-v3, main]
  pull_request:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install timm albumentations kagglehub optuna openpyxl scikit-learn matplotlib pandas pillow opencv-python-headless

      - name: Run real model/data/checkpoint/calibration smoke test
        env:
          MPLBACKEND: Agg
        run: python tests/synthetic_runtime_smoke.py
